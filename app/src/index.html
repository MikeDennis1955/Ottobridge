<title>Ottobridge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
/* Layout: felt table on the left, step commentary + review form + tabbed detail on the right; stacks on phones. */
:root {
  --bg: #e9eeea; --panel: #ffffff; --ink: #18221d; --muted: #5b6a62; --line: #d3dcd6;
  --felt: #1d5a44; --felt-2: #17483a; --felt-ink: #f2f6f3; --felt-muted: #b9d0c4;
  --accent: #a87521; --accent-soft: #f3e6cc;
  --red: #c4242b; --black: #18221d; --card: #fffdf8; --card-ink: #18221d;
  --ok: #2f7d4f; --ok-soft: #dcefe2; --bad: #b3261e; --bad-soft: #f9dedc; --warn: #8a5a00; --warn-soft: #fbeccb; --q: #2b5ea7; --q-soft: #dde8f8;
  --bc-pass: #2f8a55; --bc-dbl: #c4242b; --bc-rdbl: #2b5ea7; --bc-bid: #ffffff;
  --f-body: "Atkinson Hyperlegible", system-ui, sans-serif;
  --f-display: "Fraunces", Georgia, serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1513; --panel: #18201c; --ink: #e5ece8; --muted: #9aaba2; --line: #2b3732;
  --felt: #174636; --felt-2: #12382b; --felt-ink: #eef4f0; --felt-muted: #9fbcae;
  --accent: #e0aa4c; --accent-soft: #3a2e17;
  --red: #ff6b6b; --black: #e5ece8; --card: #fbf8f1; --card-ink: #18221d;
  --ok: #6cc890; --ok-soft: #1c3527; --bad: #ff8a80; --bad-soft: #3d1f1d; --warn: #f0c060; --warn-soft: #3a2f14; --q: #8db6f0; --q-soft: #1c2a40;
  --bc-bid: #f4f1ea; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1513; --panel: #18201c; --ink: #e5ece8; --muted: #9aaba2; --line: #2b3732;
  --felt: #174636; --felt-2: #12382b; --felt-ink: #eef4f0; --felt-muted: #9fbcae;
  --accent: #e0aa4c; --accent-soft: #3a2e17;
  --red: #ff6b6b; --black: #e5ece8; --card: #fbf8f1; --card-ink: #18221d;
  --ok: #6cc890; --ok-soft: #1c3527; --bad: #ff8a80; --bad-soft: #3d1f1d; --warn: #f0c060; --warn-soft: #3a2f14; --q: #8db6f0; --q-soft: #1c2a40;
  --bc-bid: #f4f1ea; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 40px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sym.red { color: var(--red); } .sym.blk { color: var(--black); }
.muted { color: var(--muted); } .small { font-size: 13px; }
.lbl { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; margin-bottom: 2px; }

header.top { max-width: 1280px; margin: 0 auto 12px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.brand { font-family: var(--f-display); font-weight: 600; font-size: 20px; letter-spacing: -.01em; }
.brand small { font-family: var(--f-body); font-weight: 400; font-size: 13px; color: var(--muted); margin-left: 6px; }
#picker { flex: 1 1 260px; min-width: 0; max-width: 520px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
#store { font-size: 12.5px; color: var(--muted); }

main { max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); } }

.handhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-bottom: 8px; }
#title { font-family: var(--f-display); font-weight: 600; font-size: 24px; margin: 0; text-wrap: balance; }
#meta { color: var(--muted); font-size: 13.5px; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; }
.dot { opacity: .5; }
.chip { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); vertical-align: middle; }
.chip.type-example { background: var(--q-soft); color: var(--q); }
.chip.type-counting { background: var(--warn-soft); color: var(--warn); }
.chip.edited { background: var(--warn-soft); color: var(--warn); }
.chip.you { background: var(--accent-soft); color: var(--accent); }
.chip.pause { background: var(--q-soft); color: var(--q); }

.checks { border: 0; cursor: pointer; padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 13.5px; margin-bottom: 10px; display: inline-flex; gap: 8px; align-items: center; }
.checks::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
.checks.ok { background: var(--ok-soft); color: var(--ok); }
.checks.warn { background: var(--warn-soft); color: var(--warn); }
.checks.bad { background: var(--bad-soft); color: var(--bad); }

.handlist { max-width: 1280px; margin: 0 auto 14px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
#handlist { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.hbtn { border: 1.5px solid var(--line); background: var(--panel); border-radius: 999px; padding: 2px 8px; cursor: pointer; font-size: 13px; min-width: 34px; }
.hgroup { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; width: 100%; }
.hles { font-size: 12px; font-weight: 700; color: var(--muted); width: 70px; }
.hbtn:hover { border-color: var(--accent); }
.hbtn.on { border-color: var(--accent); background: var(--accent-soft); }
.hbtn.bad b { color: var(--bad); }
/* ---- the table ---- */
.felt { position: relative; background: radial-gradient(ellipse at 50% 45%, var(--felt) 0%, var(--felt-2) 100%); border-radius: 18px; color: var(--felt-ink);
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr) minmax(0, 1fr); grid-template-rows: auto minmax(190px, auto) auto; gap: 8px; padding: 14px; min-height: 460px; }
.hand { padding: 8px 10px; border-radius: 10px; border: 1.5px solid transparent; font-size: 17px; line-height: 1.35; align-self: center; min-width: 0; }
.hand.turn { border-color: var(--accent); background: rgba(0,0,0,.12); }
.hand.top { grid-column: 2; grid-row: 1; justify-self: center; }
.hand.left { grid-column: 1; grid-row: 2; justify-self: start; }
.hand.right { grid-column: 3; grid-row: 2; justify-self: end; }
.hand.bottom { grid-column: 2; grid-row: 3; justify-self: center; }
.hlabel { font-size: 13px; color: var(--felt-muted); margin-bottom: 3px; display: flex; flex-wrap: wrap; gap: 0 6px; align-items: baseline; }
.hlabel b { color: var(--felt-ink); font-size: 14px; }
.hlabel .hcp { margin-left: auto; font-variant-numeric: tabular-nums; }
.hlabel .you, .hlabel .role { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; color: var(--accent); }
.hlabel .role { color: var(--felt-muted); }
.srow { display: flex; gap: 6px; white-space: nowrap; }
.srow .sym { width: 1.1em; text-align: center; background: var(--card); border-radius: 4px; line-height: 1.25; font-size: 15px; align-self: center; }
.srow .sym.blk { color: var(--card-ink); } .srow .sym.red { color: #c4242b; }
.ranks { letter-spacing: .08em; font-weight: 700; font-variant-numeric: tabular-nums; }
.r.gone { opacity: .35; text-decoration: line-through; font-weight: 400; }
.void { opacity: .5; }
.centre { grid-column: 2; grid-row: 2; position: relative; min-height: 190px; }
.pcard { position: absolute; width: 52px; height: 72px; background: var(--card); color: var(--card-ink); border-radius: 7px; box-shadow: 0 2px 6px rgba(0,0,0,.35);
  display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; line-height: 1.05; transition: transform .15s; }
.pcard.red { color: #c4242b; }
.pcard i { position: absolute; bottom: -18px; font-style: normal; font-size: 11px; font-weight: 400; color: var(--felt-muted); }
.pcard.win { box-shadow: 0 0 0 3px var(--accent), 0 2px 6px rgba(0,0,0,.35); }
.pcard.latest { transform: scale(1.06); }
.at-bottom { left: 50%; bottom: 4px; margin-left: -26px; }
.at-top { left: 50%; top: 4px; margin-left: -26px; }
.at-left { left: 6%; top: 50%; margin-top: -36px; }
.at-right { right: 6%; top: 50%; margin-top: -36px; }
.tno { position: absolute; left: 4px; top: 2px; font-size: 12px; color: var(--felt-muted); }
.ccall { position: absolute; }
.ccall.at-bottom, .ccall.at-top { margin-left: -30px; }
.ccall.at-left, .ccall.at-right { margin-top: -20px; }
.contract { grid-column: 3; grid-row: 3; justify-self: end; align-self: end; text-align: right; font-size: 13px; color: var(--felt-muted); }
.contract b { font-size: 20px; color: var(--felt-ink); }
.contract span { font-variant-numeric: tabular-nums; }
.compass { grid-column: 1; grid-row: 3; align-self: end; width: 56px; height: 56px; position: relative; border: 1px solid rgba(255,255,255,.25); border-radius: 50%; font-size: 11px; color: var(--felt-muted); }
.compass span { position: absolute; }
.compass .c-top { top: 2px; left: 50%; transform: translateX(-50%); } .compass .c-bottom { bottom: 2px; left: 50%; transform: translateX(-50%); }
.compass .c-left { left: 5px; top: 50%; transform: translateY(-50%); } .compass .c-right { right: 5px; top: 50%; transform: translateY(-50%); }
.empty { padding: 40px; text-align: center; color: var(--muted); background: var(--panel); border-radius: 14px; }
@media (max-width: 560px) {
  .tno { top: auto; bottom: 2px; }
  .felt { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: auto auto auto auto; padding: 10px; min-height: 0; }
  .hand { font-size: 15px; padding: 6px; }
  .hand.top { grid-column: 1 / 3; grid-row: 1; }
  .hand.left { grid-column: 1; grid-row: 2; justify-self: start; }
  .hand.right { grid-column: 2; grid-row: 2; justify-self: end; }
  .centre { grid-column: 1 / 3; grid-row: 3; min-height: 180px; }
  .hand.bottom { grid-column: 1 / 3; grid-row: 4; }
  .contract { grid-column: 2; grid-row: 1; align-self: start; }
  .compass { display: none; }
}

.backs { display: flex; flex-wrap: nowrap; gap: 0; padding: 4px 0 2px 9px; }
.backs span { flex: none; width: 16px; height: 24px; margin-left: -9px; border-radius: 3px; border: 1.5px solid var(--card); background: repeating-linear-gradient(45deg, #7a2430 0 3px, #8e2f3b 3px 6px); }
/* ---- student mode ---- */
.modes { display: inline-flex; border: 1.5px solid var(--line); border-radius: 999px; overflow: hidden; }
.modes button { border: 0; background: var(--panel); padding: 5px 14px; font-weight: 700; font-size: 13.5px; cursor: pointer; color: var(--muted); }
.modes button.on { background: var(--accent); color: #fff; }
.student-only { display: none; }
body.student .student-only { display: inline-flex; }
body.student .review-only { display: none !important; }
body.student #meta .chip.edited { display: none; }
.helpsw { align-items: center; gap: 6px; font-weight: 700; font-size: 14px; padding: 0 6px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.bbox { display: grid; gap: 4px; max-width: 340px; }
.bbrow { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.bbrow.specials { grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 4px; }
.bb { min-height: 40px; border-radius: 6px; border: 1.5px solid rgba(0,0,0,.18); font-weight: 700; font-size: 15px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.bb.bid { background: var(--bc-bid); color: #18221d; } .bb.bid .sym.blk { color: #18221d; } .bb.bid .sym.red { color: #c4242b; }
.bb.pass { background: var(--bc-pass); color: #fff; } .bb.dbl { background: var(--bc-dbl); color: #fff; } .bb.rdbl { background: var(--bc-rdbl); color: #fff; }
.bb:disabled { opacity: .22; cursor: default; }
.bb:not(:disabled):hover { outline: 2px solid var(--accent); }
.verdict { border-radius: 8px; padding: 8px 10px; }
.verdict.yes { background: var(--ok-soft); color: var(--ok); }
.verdict.no { background: var(--warn-soft); color: var(--ink); } .verdict.no b { color: var(--ink); }
.verdict-pick { color: var(--muted); }
.score { font-weight: 700; }
.planform { display: grid; gap: 8px; }
.pq { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.pq input { width: 64px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-size: 16px; }
.ok-t { color: var(--ok); font-weight: 700; } .no-t { color: var(--bad); font-weight: 700; }
.ranks .r.play { border: 0; background: var(--card); color: var(--card-ink); border-radius: 4px; font: inherit; font-weight: 700; padding: 0 5px; margin-right: 3px; cursor: pointer; box-shadow: 0 0 0 2px var(--accent); }
.ranks .r.play:hover { transform: translateY(-2px); }
.ranks .r.dim { opacity: .45; }
.demobadge { position: absolute; right: 14px; top: 12px; background: #ffd23f; color: #1a1a1a; font-weight: 800; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; padding: 4px 14px; border-radius: 999px; z-index: 2; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
.yourturn { position: absolute; left: 14px; top: 12px; background: var(--accent); color: #fff; font-weight: 700; font-size: 13px; padding: 3px 12px; border-radius: 999px; z-index: 2; }
body.student .hand .hcp { display: none; }
/* ---- bidding box cards ---- */
.bc { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; padding: 2px 7px; border-radius: 5px; font-weight: 700; font-size: 14px; line-height: 1.3; border: 1.5px solid rgba(0,0,0,.18); }
.bc.pass { background: var(--bc-pass); color: #fff; } .bc.dbl { background: var(--bc-dbl); color: #fff; } .bc.rdbl { background: var(--bc-rdbl); color: #fff; }
.bc.bid { background: var(--bc-bid); color: #18221d; } .bc.bid .sym.blk { color: #18221d; } .bc.bid .sym.red { color: #c4242b; }
.bc .nt { font-size: 12px; margin-left: 1px; }
.bc.big { font-size: 20px; min-width: 60px; padding: 6px 10px; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
.bc.sm { font-size: 12.5px; min-width: 36px; padding: 0 5px; }

/* ---- lesson pages ---- */
[hidden] { display: none !important; }
#lessonview { max-width: 820px; margin: 0 auto; padding: 0 16px 48px; }
.lpage h1 { font-family: var(--f-head, inherit); font-size: 28px; margin: 8px 0 2px; }
.lpage h2, .lpage h3 { font-size: 18px; font-weight: 700; margin: 0; }
.lpage h3 { margin: 22px 0 6px; }
.lpage h4, .lpage h2.sub { font-size: 15px; margin: 14px 0 4px; }
.lpage h2.sub { margin: 0; }
.lauc { border-collapse: collapse; margin: 8px 0 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
.lauc th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 6px 14px 2px; text-align: left; }
.lauc td { padding: 2px 14px; min-width: 44px; font-weight: 700; }
.lauc tr:last-child td { padding-bottom: 8px; }
.laside { border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin: 16px 0; background: var(--bg); }
.laside .lasidet { font-weight: 700; text-transform: uppercase; letter-spacing: .04em; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.laside p { margin: 0; }
.lnote { border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 8px; padding: 10px 14px; margin: 12px 0; line-height: 1.6; }
.lpre { font: 14px/1.5 ui-monospace, Menlo, monospace; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; }
.lpage p, .lpage li { line-height: 1.6; }
.lintro { margin: 14px 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.lintro summary { cursor: pointer; font-weight: 700; }
.lconcept { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 14px 0; scroll-margin-top: 12px; }
.lchead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.cid { color: var(--accent); font-weight: 800; margin-right: 4px; }
.lpractice { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 10px; }
.lhands { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.lhand { font: inherit; text-align: left; border: 1px solid var(--line); background: var(--bg); color: inherit; border-radius: 10px; padding: 8px 12px; cursor: pointer; min-height: 44px; display: flex; align-items: center; gap: 8px; }
.lhand:hover { border-color: var(--accent); }
.pdone { font-size: 12px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 1px 8px; }
.ccard { border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; }
.ccard p { margin: 4px 0; font-style: italic; }
.linkbtn { font: inherit; font-size: 13px; background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; }
.navsep { color: var(--muted); margin: 0 4px; }
.navhand { font-size: 14px; }

/* ---- controls ---- */
.askbtn { margin-left: auto; font-size: 13px; opacity: .8; }
.askpanel { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 8px; }
.askhead { display: flex; justify-content: space-between; align-items: center; }
.btn.sm { padding: 2px 8px; min-height: 0; }
.asklog { max-height: 320px; overflow-y: auto; display: grid; gap: 8px; }
.am p { margin: 0 0 6px; }
.am { padding: 8px 10px; border-radius: 10px; line-height: 1.45; }
.am.user { background: var(--panel2, rgba(0,0,0,.05)); justify-self: end; max-width: 85%; }
.am.assistant { border: 1px solid var(--line); }
.askform { display: flex; gap: 8px; align-items: flex-end; }
.askform textarea { flex: 1; font: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: inherit; resize: vertical; }
.controls { margin-top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 8px; }
.btns { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-weight: 700; font-size: 14px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.ghost { background: transparent; }
.btn.file { position: relative; overflow: hidden; } .btn.file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.scrubwrap { position: relative; margin-top: 14px; padding-block: 6px; }
#scrub { height: 24px; }
#scrub { width: 100%; accent-color: var(--accent); }
#marks { position: absolute; left: 8px; right: 8px; top: 14px; height: 8px; pointer-events: none; z-index: 1; }
.mk { position: absolute; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; }
.mk.ok, .nm.ok { background: var(--ok); } .mk.problem, .nm.problem { background: var(--bad); } .mk.question, .nm.question { background: var(--q); }
#where { font-weight: 700; font-variant-numeric: tabular-nums; }
.opts { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); align-items: center; }
kbd { font: 12px var(--f-body); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }

/* ---- right column ---- */
main > aside { display: grid; gap: 14px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
#stepcard { display: grid; gap: 10px; }
#stepcard p { margin: 0; max-width: 65ch; }
.headline { font-size: 18px; font-weight: 700; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.hscore { white-space: nowrap; }
.contract b.fscore { font-size: 15px; }
.cardtxt { font-weight: 700; }
.meaning { padding-left: 10px; border-left: 3px solid var(--line); }
.meaning.missing { color: var(--muted); font-size: 13px; }
.key { background: var(--accent-soft); border-radius: 8px; padding: 8px 10px; }
.note { margin-top: 6px; background: var(--q-soft); border-radius: 8px; padding: 8px 10px; }
.trickdone { font-weight: 700; } .trickdone .note { font-weight: 400; }
.whynot { display: grid; gap: 5px; }
.wn { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px; align-items: start; font-size: 14px; }
.wk { font-weight: 700; }
ul.plan { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.noteform { border-top: 1px dashed var(--line); padding-top: 10px; display: grid; gap: 8px; }
.flags { display: flex; flex-wrap: wrap; gap: 6px; }
.flag input { position: absolute; opacity: 0; }
